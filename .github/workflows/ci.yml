name: CityLens CI
# Lockfile is validated with the pinned pnpm toolchain.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: citylens-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-typecheck:
    name: Build and typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.1
        with:
          version: 12.9.1
          run_install: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Typecheck
        run: pnpm lint
      - name: Test server validation
        run: pnpm test
      - name: Build
        run: pnpm build
      - name: Smoke test built production server
        shell: bash
        env:
          NODE_ENV: production
          GEMINI_API_KEY: ''
        run: |
          node dist/server.cjs > /tmp/citylens-production.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          ready=false
          for i in {1..30}; do
            if ! kill -0 "$server_pid" 2>/dev/null; then
              cat /tmp/citylens-production.log
              exit 1
            fi
            if curl --fail --silent http://127.0.0.1:3000/api/health; then
              ready=true
              break
            fi
            sleep 1
          done
          test "$ready" = true || { cat /tmp/citylens-production.log; exit 1; }
          curl --fail --silent http://127.0.0.1:3000/ | grep -qi '<html'
          curl --fail --silent http://127.0.0.1:3000/fixture-spa-route | grep -qi '<html'
          for i in {1..119}; do
            curl --fail --silent http://127.0.0.1:3000/fixture-spa-route > /tmp/citylens-spa.html
          done
          test "$(curl --silent --output /tmp/citylens-rate-limit.txt --write-out '%{http_code}' http://127.0.0.1:3000/fixture-spa-route)" = 429
